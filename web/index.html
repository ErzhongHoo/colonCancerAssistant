<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>结直肠病例助手 MVP</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --border: #d9e1ef;
        --text: #17233d;
        --muted: #5e6c84;
        --primary: #0f6fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: radial-gradient(circle at top, #ecf3ff, var(--bg) 50%);
        color: var(--text);
      }
      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        height: 100vh;
      }
      .side, .main {
        padding: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }
      .side .card + .card { margin-top: 14px; }
      h1 { font-size: 18px; margin: 0 0 14px; }
      .muted { color: var(--muted); font-size: 13px; }
      #upload-btn, #send-btn {
        background: var(--primary);
        color: #fff;
        border: 0;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
      }
      #upload-btn:disabled, #send-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #upload-btn { width: 100%; margin-top: 10px; }
      #files-list, #sources-list {
        margin: 8px 0 0;
        padding-left: 16px;
        font-size: 13px;
      }
      .main {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #chat-box {
        flex: 1;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
      }
      .msg {
        max-width: 80%;
        padding: 12px 14px;
        margin-bottom: 12px;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .msg p { margin: 0 0 8px; }
      .msg p:last-child { margin-bottom: 0; }
      .msg h1, .msg h2, .msg h3 { margin: 8px 0; }
      .msg ul { margin: 6px 0 6px 20px; padding: 0; }
      .msg code {
        background: #e7ecf6;
        padding: 1px 5px;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .msg pre {
        margin: 8px 0;
        background: #111827;
        color: #e5e7eb;
        border-radius: 10px;
        padding: 10px;
        overflow-x: auto;
      }
      .msg pre code {
        background: transparent;
        padding: 0;
        color: inherit;
      }
      .msg hr {
        border: 0;
        border-top: 1px solid #cfd8e8;
        margin: 10px 0;
      }
      .msg table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0;
        font-size: 13px;
      }
      .msg th, .msg td {
        border: 1px solid #d9e1ef;
        padding: 6px 8px;
        text-align: left;
      }
      .msg th {
        background: #eef3ff;
      }
      .user { background: #dceaff; margin-left: auto; }
      .assistant { background: #eef2f9; }
      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      #message {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; height: auto; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="side">
        <div class="card">
          <h1>病例上传</h1>
          <div class="muted">支持 PDF / 图片 / txt。上传后自动构建检索库。</div>
          <input id="file-input" type="file" multiple />
          <button id="upload-btn">上传并入库</button>
          <ul id="files-list"></ul>
        </div>
        <div class="card">
          <h1>引用片段</h1>
          <ul id="sources-list"></ul>
        </div>
      </aside>
      <main class="main">
        <div id="chat-box"></div>
        <div class="composer">
          <input id="message" placeholder="输入问题，例如：这份报告提示几期？下一步怎么做？" />
          <button id="send-btn">发送</button>
        </div>
      </main>
    </div>
    <script>
      const history = [];
      const chatBox = document.getElementById("chat-box");
      const sourcesList = document.getElementById("sources-list");
      const filesList = document.getElementById("files-list");
      const uploadBtn = document.getElementById("upload-btn");
      const sendBtn = document.getElementById("send-btn");

      function renderMessage(role, text) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        if (role === "assistant") {
          div.innerHTML = renderMarkdown(text);
        } else {
          div.textContent = text;
        }
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function escapeHtml(raw) {
        return raw
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderMarkdown(md) {
        let safe = escapeHtml(md || "");

        const codeBlocks = [];
        safe = safe.replace(/```([\s\S]*?)```/g, (_, code) => {
          const token = `__CODE_BLOCK_${codeBlocks.length}__`;
          codeBlocks.push(`<pre><code>${code.trim()}</code></pre>`);
          return token;
        });

        safe = safe
          .replace(/^### (.*)$/gm, "<h3>$1</h3>")
          .replace(/^## (.*)$/gm, "<h2>$1</h2>")
          .replace(/^# (.*)$/gm, "<h1>$1</h1>")
          .replace(/^\s*---+\s*$/gm, "<hr/>")
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`\n]+)`/g, "<code>$1</code>")
          .replace(/^- (.*)$/gm, "<li>$1</li>");

        safe = safe.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");
        safe = safe
          .split(/\n{2,}/)
          .map((block) => {
            const t = block.trim();
            if (!t) return "";
            if (isMarkdownTable(t)) return renderTable(t);
            if (/^<h[1-3]>/.test(t) || /^<ul>/.test(t) || /^__CODE_BLOCK_/.test(t) || /^<pre>/.test(t)) return t;
            return `<p>${t.replace(/\n/g, "<br/>")}</p>`;
          })
          .join("");

        codeBlocks.forEach((html, i) => {
          safe = safe.replace(`__CODE_BLOCK_${i}__`, html);
        });
        return safe;
      }

      function isMarkdownTable(block) {
        const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
        if (lines.length < 2) return false;
        if (!lines[0].includes("|")) return false;
        return /^\|?[\s:-]+\|[\s|:-]*\|?$/.test(lines[1]);
      }

      function renderTable(block) {
        const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
        const parseCells = (line) =>
          line.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
        const headers = parseCells(lines[0]);
        const rows = lines.slice(2).map(parseCells);
        const thead = `<thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>`;
        const tbody = `<tbody>${rows
          .map((r) => `<tr>${headers.map((_, i) => `<td>${r[i] || ""}</td>`).join("")}</tr>`)
          .join("")}</tbody>`;
        return `<table>${thead}${tbody}</table>`;
      }

      async function uploadFiles() {
        const input = document.getElementById("file-input");
        if (!input.files.length) return;
        uploadBtn.disabled = true;
        uploadBtn.textContent = "OCR处理中，请稍候...";
        const form = new FormData();
        Array.from(input.files).forEach((f) => form.append("files", f));
        try {
          const res = await fetch("/api/upload", { method: "POST", body: form });
          const data = await res.json();
          filesList.innerHTML = "";
          (data.results || []).forEach((item) => {
            const li = document.createElement("li");
            li.textContent = item.ok
              ? `${item.file}（${item.chunks} chunks）`
              : `${item.file}（上传失败: ${item.error || "未知错误"}）`;
            filesList.appendChild(li);
          });
          if (!res.ok && !(data.results || []).length) {
            const li = document.createElement("li");
            li.textContent = `上传失败: ${data.detail || "未知错误"}`;
            filesList.appendChild(li);
          }
        } catch (err) {
          filesList.innerHTML = "";
          const li = document.createElement("li");
          li.textContent = `上传失败: ${err?.message || "网络错误"}`;
          filesList.appendChild(li);
        } finally {
          uploadBtn.disabled = false;
          uploadBtn.textContent = "上传并入库";
        }
      }

      async function sendMessage() {
        const input = document.getElementById("message");
        const text = input.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        renderMessage("user", text);
        input.value = "";
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, history }),
          });
          const data = await res.json();
          renderMessage("assistant", data.answer || "出错了，请稍后再试。");
          history.push({ role: "user", content: text });
          history.push({ role: "assistant", content: data.answer || "" });
          sourcesList.innerHTML = "";
          (data.sources || []).forEach((s) => {
            const li = document.createElement("li");
            li.textContent = `${s.source}: ${s.preview}`;
            sourcesList.appendChild(li);
          });
        } catch (err) {
          renderMessage("assistant", `出错了：${err?.message || "网络错误"}`);
        } finally {
          sendBtn.disabled = false;
        }
      }

      document.getElementById("upload-btn").addEventListener("click", uploadFiles);
      document.getElementById("send-btn").addEventListener("click", sendMessage);
      document.getElementById("message").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      renderMessage("assistant", "你好，我可以基于你上传的病例/检查报告做科普解释，并给出下一步治疗路径建议。");
    </script>
  </body>
</html>
